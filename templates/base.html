<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Expense Portal{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-role="{{ role|default('') }}">
<div id="toast" class="toast" role="status"></div>
<div class="app">
<aside class="sidebar"><a class="brand" href="/">Expense Portal</a><p class="role-label" id="role-label">{{ role|default('')|replace('_',' ')|title }}</p><nav id="navigation"></nav><button id="logout" class="nav-button">Log out</button></aside>
<main class="main"><header class="topbar"><button id="menu" class="icon-button" aria-label="Open menu">&#9776;</button><div><span class="muted">Workspace</span><strong id="page-title">Dashboard</strong></div><span id="identity" class="identity"></span></header><div class="content">{% block content %}{% endblock %}</div></main>
</div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script><script src="{{ url_for('static', filename='js/auth.js') }}"></script><script src="{{ url_for('static', filename='js/common.js') }}"></script><script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
